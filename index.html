<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Incinte Acustice - Subwoofer</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #fff;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        .results {
            margin-top: 25px;
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculator Incinte Subwoofer</h2>
    <div class="subtitle">Introdu datele tehnice ale difuzorului</div>
    
    <div class="form-group">
        <label for="dimensiune_difuzor">1. Mărime difuzor:</label>
        <select id="dimensiune_difuzor">
            <option value="5">5 inchi (13 cm)</option>
            <option value="6.5">6.5 inchi (16.5 cm)</option>
            <option value="8">8 inchi (20 cm)</option>
            <option value="10" selected>10 inchi (25 cm)</option>
            <option value="12">12 inchi (30 cm)</option>
            <option value="15">15 inchi (38 cm)</option>
            <option value="18">18 inchi (46 cm)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="fs">2. Fs - Frecvența de rezonanță (Hz):</label>
        <input type="number" id="fs" value="35.0" step="0.1">
    </div>

    <div class="form-group">
        <label for="qts">3. Qts - Factor de calitate total:</label>
        <input type="number" id="qts" value="0.40" step="0.01">
    </div>

    <div class="form-group">
        <label for="vas">4. Vas - Volum echivalent (litri):</label>
        <input type="number" id="vas" value="50.0" step="0.1">
    </div>

    <div class="form-group">
        <label for="qtc">5. Qtc dorit (Incită Închisă):</label>
        <input type="number" id="qtc" value="0.707" step="0.001">
    </div>

    <div class="form-group">
        <label for="diametru">6. Diametru tub Bass-Reflex (cm):</label>
        <input type="number" id="diametru" value="7.0" step="0.1">
    </div>

    <button onclick="calculeaza()">Calculează Incintele</button>

    <div class="results" id="rezultate">
        <h3>Rezultate Calcul:</h3>
        <div class="result-item">Apasă butonul de deasupra pentru a calcula.</div>
    </div>
</div>

<script>
function calculeaza() {
    let fs = parseFloat(document.getElementById('fs').value) || 35.0;
    let qts = parseFloat(document.getElementById('qts').value) || 0.40;
    let vas = parseFloat(document.getElementById('vas').value) || 50.0;
    let qtc_dorit = parseFloat(document.getElementById('qtc').value) || 0.707;
    let diametru_cm = parseFloat(document.getElementById('diametru').value) || 7.0;

    let rezDiv = document.getElementById('rezultate');

    if (qtc_dorit <= qts) {
        rezDiv.innerHTML = `<h3>Eroare:</h3><div style="color: #ff6b6b;"><b>Qtc dorit</b> trebuie să fie mai mare decât <b>Qts-ul</b>!</div>`;
        return;
    }

    let vb_inchis = vas / (Math.pow(qtc_dorit / qts, 2) - 1);
    let fc_inchis = fs * (qtc_dorit / qts);

    let vb_br = 15 * Math.pow(qts, 2.87) * vas;
    let fb_br = 0.42 * fs * Math.pow(qts, -0.9);

    let c = 344.0;
    let vb_m3 = vb_br / 1000.0;
    let r_m = (diametru_cm / 100.0) / 2.0;
    let s_m2 = Math.PI * Math.pow(r_m, 2);
    let delta_m = 0.732 * (diametru_cm / 100.0);

    let termen = (Math.pow(c, 2) * s_m2) / (4 * Math.pow(Math.PI, 2) * Math.pow(fb_br, 2) * vb_m3);
    let lp_m = termen - delta_m;
    let lungime_tub_cm = lp_m * 100.0;

    let lungime_text = lungime_tub_cm <= 0 ? "Imposibil (volum prea mic sau tub prea gros)" : `${lungime_tub_cm.toFixed(2)} cm`;

    rezDiv.innerHTML = `
        <h3>Rezultate Calcul:</h3>
        <p><strong>1. Incintă Închisă:</strong></p>
        <ul>
            <li>Volum cutie (Vb): <strong>${vb_inchis.toFixed(2)} litri</strong></li>
            <li>Frecvență rezonanță (Fc): <strong>${fc_inchis.toFixed(2)} Hz</strong></li>
        </ul>
        <p><strong>2. Incintă Bass-Reflex:</strong></p>
        <ul>
            <li>Volum cutie (Vb): <strong>${vb_br.toFixed(2)} litri</strong></li>
            <li>Frecvență acord (Fb): <strong>${fb_br.toFixed(2)} Hz</strong></li>
            <li>Lungime tub (${diametru_cm} cm): <strong>${lungime_text}</strong></li>
        </ul>
    `;
}
</script>

</body>
</html>
